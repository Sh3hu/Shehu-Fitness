<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Shehu Fitness</title>

<style>
body{
  font-family:system-ui,sans-serif;
  margin:0;
  background:#f4f5f7;
  color:#171717
}

header{
  background:#171717;
  color:white;
  padding:20px
}

header h1{
  margin:0 0 6px
}

main{
  max-width:900px;
  margin:auto;
  padding:16px
}

.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 8px #0001
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  margin:4px;
  background:#171717;
  color:white;
  font-weight:600
}

button.secondary{
  background:#e7e7e7;
  color:#111
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:8px
}

.exercise{
  padding:14px 0;
  border-bottom:1px solid #eee
}

.exercise-top{
  display:flex;
  align-items:center;
  gap:10px
}

.exercise input[type=checkbox]{
  width:20px;
  height:20px
}

.inputs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px
}

.inputs label{
  font-size:12px;
  color:#666
}

.inputs input{
  width:100%;
  box-sizing:border-box;
  padding:8px;
  border:1px solid #ccc;
  border-radius:7px;
  margin-top:3px
}

.done{
  text-decoration:line-through;
  color:#777
}

.timer{
  font-size:40px;
  font-weight:800;
  text-align:center;
  margin:12px
}

.small{
  color:#666;
  font-size:14px
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  text-align:center
}

.stat{
  background:#f4f5f7;
  padding:12px 5px;
  border-radius:10px
}

.stat strong{
  display:block;
  font-size:24px
}

.history-item{
  padding:10px 0;
  border-bottom:1px solid #eee
}

@media(max-width:500px){
  .inputs{
    grid-template-columns:1fr 1fr
  }

  .stats{
    grid-template-columns:1fr 1fr
  }
}
</style>
</head>

<body>

<header>
  <h1>🏋️ Shehu Fitness</h1>
  <div>Monday–Saturday • 6:00–8:00 PM</div>
</header>

<main>

<!-- DAY SELECTOR -->
<div class="card">
  <h2 id="dayTitle"></h2>
  <div class="grid" id="days"></div>
</div>

<!-- TIMER -->
<div class="card">
  <h2>⏱️ Workout Timer</h2>

  <div class="timer" id="timer">02:00</div>

  <div style="text-align:center">
    <button onclick="startTimer()">Start</button>
    <button class="secondary" onclick="resetTimer()">Reset</button>
  </div>

  <div class="small" style="text-align:center">
    Use for your 2-minute breaks.
  </div>
</div>

<!-- WORKOUT -->
<div class="card">
  <h2>Exercises</h2>
  <div id="routine"></div>
</div>

<!-- TODAY'S PROGRESS -->
<div class="card">
  <h2>📊 Today's Progress</h2>

  <div class="stats">
    <div class="stat">
      <strong id="completed">0</strong>
      Exercises
    </div>

    <div class="stat">
      <strong id="setsTotal">0</strong>
      Sets
    </div>

    <div class="stat">
      <strong id="volumeTotal">0</strong>
      Volume
    </div>
  </div>

  <p id="progress"></p>

  <button class="secondary" onclick="clearDay()">
    Clear Today's Workout
  </button>
</div>

<!-- HISTORY -->
<div class="card">
  <h2>📅 Workout History</h2>

  <div id="history"></div>

  <button class="secondary" onclick="clearHistory()">
    Clear History
  </button>
</div>

</main>

<script>

const plans={

Monday:{
  focus:"Lower Body",
  ex:[
    "Leg Press",
    "Leg Extension",
    "Leg Curl",
    "Goblet Squat",
    "Calf Raise",
    "Deadlift"
  ]
},

Tuesday:{
  focus:"Upper Body",
  ex:[
    "Lat Pulldown",
    "Bench Press",
    "Shoulder Press",
    "Lateral Raise",
    "Biceps Curl",
    "Triceps Pushdown"
  ]
},

Wednesday:{
  focus:"Back + Rear Shoulders",
  ex:[
    "Pull-ups",
    "Lat Pulldown",
    "Straight-Arm Cable Pulldown",
    "Face Pulls",
    "Dumbbell Rear-Delt Raises",
    "Dumbbell Pullover"
  ]
},

Thursday:{
  focus:"Lower Body",
  ex:[
    "Leg Press",
    "Romanian Deadlift",
    "Leg Curl",
    "Leg Extension",
    "Hip Thrust",
    "Calf Raise"
  ]
},

Friday:{
  focus:"Upper Body",
  ex:[
    "Lat Pulldown",
    "Bench Press",
    "Dumbbell Pullover",
    "Lateral Raise",
    "Biceps Curl",
    "Triceps Pushdown"
  ]
},

Saturday:{
  focus:"Full Body",
  ex:[
    "Leg Press",
    "Bench Press",
    "Lat Pulldown",
    "Shoulder Press",
    "Biceps Curl",
    "Triceps Pushdown"
  ]
},

Sunday:{
  focus:"Rest",
  ex:[]
}

};

const key="shehuFitnessData";

let data=JSON.parse(
  localStorage.getItem(key)||"{}"
);

let selected=new Date().toLocaleDateString(
  "en-US",
  {weekday:"long"}
);

if(!plans[selected] || selected==="Sunday"){
  selected="Monday";
}


/* SAVE */

function save(){
  localStorage.setItem(
    key,
    JSON.stringify(data)
  );
}


/* RENDER */

function render(){

  const plan=plans[selected];

  document.getElementById("dayTitle").textContent=
    selected+" — "+plan.focus;


  document.getElementById("days").innerHTML=
    Object.keys(plans)
    .filter(d=>d!=="Sunday")
    .map(d=>`
      <button
        class="${d===selected?'':'secondary'}"
        onclick="selected='${d}';render()">
        ${d}
      </button>
    `)
    .join("");


  const workout=data[selected]||{};


  document.getElementById("routine").innerHTML=
    plan.ex.map((exercise,i)=>{

      const item=workout[i]||{};

      return`

      <div class="exercise">

        <div class="exercise-top">

          <input
            type="checkbox"
            ${item.done?"checked":""}
            onchange="toggleExercise(${i})">

          <b class="${item.done?'done':''}">
            ${i+1}. ${exercise}
          </b>

        </div>

        <div class="inputs">

          <label>
            Sets
            <input
              type="number"
              min="0"
              value="${item.sets||''}"
              placeholder="3"
              onchange="logExercise(${i},'sets',this.value)">
          </label>

          <label>
            Reps
            <input
              type="number"
              min="0"
              value="${item.reps||''}"
              placeholder="10"
              onchange="logExercise(${i},'reps',this.value)">
          </label>

          <label>
            Weight
            <input
              type="number"
              min="0"
              step="0.5"
              value="${item.weight||''}"
              placeholder="kg"
              onchange="logExercise(${i},'weight',this.value)">
          </label>

        </div>

      </div>

      `;

    }).join("");


  updateStats();

  renderHistory();
}


/* CHECK EXERCISE */

function toggleExercise(i){

  data[selected]??={};

  data[selected][i]??={};

  data[selected][i].done=
    !data[selected][i].done;

  save();

  render();
}


/* LOG SETS / REPS / WEIGHT */

function logExercise(i,keyName,value){

  data[selected]??={};

  data[selected][i]??={};

  data[selected][i][keyName]=
    Number(value)||0;

  save();

  updateStats();

  renderHistory();
}


/* STATISTICS */

function updateStats(){

  const workout=data[selected]||{};

  const exercises=
    Object.values(workout);

  const completed=
    exercises.filter(x=>x.done).length;

  const sets=
    exercises.reduce(
      (sum,x)=>sum+(Number(x.sets)||0),
      0
    );

  const volume=
    exercises.reduce(
      (sum,x)=>
        sum+
        ((Number(x.sets)||0)*
         (Number(x.reps)||0)*
         (Number(x.weight)||0)),
      0
    );

  document.getElementById("completed")
    .textContent=completed;

  document.getElementById("setsTotal")
    .textContent=sets;

  document.getElementById("volumeTotal")
    .textContent=volume;

  document.getElementById("progress")
    .textContent=
      `${completed}/${plans[selected].ex.length} exercises completed.`;
}


/* HISTORY */

function renderHistory(){

  const history=
    document.getElementById("history");

  const days=
    Object.keys(data)
    .filter(day=>plans[day]);

  if(days.length===0){

    history.innerHTML=
      `<p class="small">
        No workout history yet.
      </p>`;

    return;
  }


  history.innerHTML=
    days.map(day=>{

      const workout=data[day]||{};

      const completed=
        Object.values(workout)
        .filter(x=>x.done).length;

      const sets=
        Object.values(workout)
        .reduce(
          (sum,x)=>sum+(Number(x.sets)||0),
          0
        );

      return`

      <div class="history-item">

        <b>${day}</b>

        <div class="small">
          ${plans[day].focus}
          • ${completed} exercises
          • ${sets} sets
        </div>

      </div>

      `;

    }).join("");
}


/* CLEAR TODAY */

function clearDay(){

  delete data[selected];

  save();

  render();
}


/* CLEAR HISTORY */

function clearHistory(){

  if(confirm("Clear all workout history?")){

    data={};

    save();

    render();

  }
}


/* TIMER */

let remaining=120;

let interval=null;


function show(){

  document.getElementById("timer")
    .textContent=
      `${String(Math.floor(remaining/60)).padStart(2,"0")}:${String(remaining%60).padStart(2,"0")}`;

}


function startTimer(){

  if(interval)return;

  interval=setInterval(()=>{

    remaining--;

    show();

    if(remaining<=0){

      clearInterval(interval);

      interval=null;

      alert("Break finished!");

      remaining=120;

      show();

    }

  },1000);

}


function resetTimer(){

  clearInterval(interval);

  interval=null;

  remaining=120;

  show();

}


/* START */

render();

show();

</script>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("./sw.js");
}
</script>

</body>
</html>
