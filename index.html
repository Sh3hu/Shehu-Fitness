<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shehu Fitness</title>

<link rel="manifest" href="./manifest.webmanifest">

<meta name="theme-color" content="#171717">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f5f7;
  color:#171717;
}

header{
  background:#171717;
  color:white;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.day-buttons{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin-bottom:15px;
}

.day-buttons button{
  border:0;
  padding:10px 13px;
  border-radius:8px;
  background:#ddd;
  white-space:nowrap;
}

.day-buttons button.active{
  background:#171717;
  color:white;
}

.exercise{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.exercise-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.exercise-top input[type="checkbox"]{
  width:20px;
  height:20px;
}

.exercise-name{
  font-weight:bold;
  font-size:17px;
}

.inputs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.inputs label{
  font-size:12px;
}

.inputs input{
  width:100%;
  padding:9px;
  margin-top:4px;
  border:1px solid #ccc;
  border-radius:7px;
}

.previous{
  font-size:12px;
  color:#777;
  margin-top:8px;
}

.stats{
  background:white;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.timer{
  text-align:center;
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}

#timerDisplay{
  font-size:35px;
  font-weight:bold;
  margin:10px;
}

.timer button,
.clear-btn{
  border:0;
  border-radius:8px;
  padding:10px 15px;
  margin:4px;
  background:#171717;
  color:white;
}

.clear-btn{
  background:#b00020;
  margin-top:15px;
}

.history{
  margin-top:15px;
}

.history-item{
  background:white;
  padding:12px;
  border-radius:10px;
  margin-bottom:8px;
}

.empty{
  color:#777;
  font-size:14px;
}

</style>
</head>

<body>

<header>
  <h1>Shehu Fitness</h1>
</header>

<div class="container">

  <div class="day-buttons" id="dayButtons"></div>

  <div class="timer">
    <h3>Rest Timer</h3>
    <div id="timerDisplay">02:00</div>

    <button onclick="startTimer()">Start</button>
    <button onclick="resetTimer()">Reset</button>
  </div>

  <div id="workout"></div>

  <div class="stats">
    <h3>Today's Progress</h3>
    <div id="stats"></div>
  </div>

  <button class="clear-btn" onclick="clearToday()">
    Clear Today's Workout
  </button>

  <div class="history">
    <h3>Workout History</h3>
    <div id="history"></div>
  </div>

</div>

<script>

/* =========================
   WORKOUT PLAN
========================= */

const plans={

  Monday:[
    "Leg Press",
    "Leg Extension",
    "Leg Curl",
    "Goblet Squat",
    "Calf Raise",
    "Deadlift"
  ],

  Tuesday:[
    "Lat Pulldown",
    "Bench Press",
    "Shoulder Press",
    "Lateral Raise",
    "Biceps Curl",
    "Triceps Pushdown"
  ],

  Wednesday:[
    "Pull-ups",
    "Lat Pulldown",
    "Straight-Arm Cable Pulldown",
    "Face Pulls",
    "Dumbbell Rear-Delt Raises",
    "Dumbbell Pullover"
  ],

  Thursday:[
    "Leg Press",
    "Romanian Deadlift",
    "Leg Curl",
    "Leg Extension",
    "Hip Thrust",
    "Calf Raise"
  ],

  Friday:[
    "Lat Pulldown",
    "Bench Press",
    "Dumbbell Pullover",
    "Lateral Raise",
    "Biceps Curl",
    "Triceps Pushdown"
  ],

  Saturday:[
    "Leg Press",
    "Bench Press",
    "Lat Pulldown",
    "Shoulder Press",
    "Biceps Curl",
    "Triceps Pushdown"
  ]

};


/* =========================
   STORAGE
========================= */

let data=
  JSON.parse(
    localStorage.getItem("shehuFitnessData")
  ) || {};

data.workouts ??={};
data.base ??={};


/* =========================
   DATE
========================= */

function getDateKey(){

  return new Date()
    .toISOString()
    .split("T")[0];

}

const today=getDateKey();

const todayDay=
  new Date().toLocaleDateString(
    "en-US",
    {weekday:"long"}
  );


/* =========================
   SELECTED DAY
========================= */

let selected=todayDay;

if(
  !plans[selected] ||
  selected==="Sunday"
){
  selected="Monday";
}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    "shehuFitnessData",
    JSON.stringify(data)
  );

}


/* =========================
   TODAY'S WORKOUT
========================= */

function getTodayWorkout(){

  data.workouts[today] ??={

    day:todayDay,

    exercises:{}

  };

  return data.workouts[today];

}


/* =========================
   DAY BUTTONS
========================= */

function renderDays(){

  const box=
    document.getElementById("dayButtons");

  box.innerHTML="";

  Object.keys(plans).forEach(day=>{

    const button=
      document.createElement("button");

    button.textContent=day;

    if(day===selected){

      button.classList.add("active");

    }

    button.onclick=()=>{

      selected=day;

      render();

    };

    box.appendChild(button);

  });

}


/* =========================
   RENDER WORKOUT
========================= */

function render(){

  renderDays();

  const box=
    document.getElementById("workout");

  box.innerHTML="";

  const workout=
    selected===todayDay
      ? getTodayWorkout()
      : null;

  const isToday=
    selected===todayDay &&
    selected!=="Sunday";

  plans[selected].forEach((exercise,i)=>{

    let item={};

    /*
      If this is today's workout,
      show today's actual values.

      Otherwise show the saved base values.
    */

    if(
      isToday &&
      workout.exercises[i]
    ){

      item=workout.exercises[i];

    }else{

      item=
        data.base?.[selected]?.[i]
        || {};

    }

    const base=
      data.base?.[selected]?.[i]
      || {};

    const checked=
      isToday && item.done
        ? "checked"
        : "";

    const disabled=
      isToday
        ? ""
        : "disabled";

    box.innerHTML+=`

      <div class="exercise">

        <div class="exercise-top">

          <input
            type="checkbox"
            ${checked}
            ${disabled}
            onchange="toggleExercise(${i})"
          >

          <div class="exercise-name">
            ${exercise}
          </div>

        </div>

        <div class="inputs">

          <label>
            Sets
            <input
              type="number"
              min="0"
              value="${item.sets ?? ""}"
              onchange="
                logExercise(
                  ${i},
                  'sets',
                  this.value
                )
              "
            >
          </label>

          <label>
            Reps
            <input
              type="number"
              min="0"
              value="${item.reps ?? ""}"
              onchange="
                logExercise(
                  ${i},
                  'reps',
                  this.value
                )
              "
            >
          </label>

          <label>
            Weight
            <input
              type="number"
              min="0"
              step="0.5"
              value="${item.weight ?? ""}"
              onchange="
                logExercise(
                  ${i},
                  'weight',
                  this.value
                )
              "
            >
          </label>

        </div>

        ${
          base.sets !== undefined ||
          base.reps !== undefined ||
          base.weight !== undefined
          ?
          `
          <div class="previous">

            Base:
            ${base.sets ?? "-"} sets ×
            ${base.reps ?? "-"} reps ×
            ${base.weight ?? "-"} kg

          </div>
          `
          :
          ""
        }

      </div>

    `;

  });

  updateStats();

  renderHistory();

}


/* =========================
   LOG EXERCISE
========================= */

function logExercise(
  i,
  keyName,
  value
){

  const num=
    Number(value)||0;

  /*
    Save the latest value as
    the new base value.
  */

  data.base[selected] ??={};

  data.base[selected][i] ??={};

  data.base[selected][i][keyName]=num;


  /*
    Only save it to today's
    actual workout when the
    selected day is today.
  */

  if(
    selected===todayDay &&
    selected!=="Sunday"
  ){

    const workout=
      getTodayWorkout();

    workout.exercises[i] ??={};

    workout.exercises[i][keyName]=num;

  }

  save();

  render();

}


/* =========================
   TOGGLE COMPLETION
========================= */

function toggleExercise(i){

  /*
    Completion belongs only
    to the actual workout today.
  */

  if(
    selected!==todayDay ||
    selected==="Sunday"
  ){

    return;

  }

  const workout=
    getTodayWorkout();

  workout.exercises[i] ??={};

  workout.exercises[i].done=
    !workout.exercises[i].done;

  save();

  render();

}


/* =========================
   TODAY'S PROGRESS
========================= */

function updateStats(){

  const stats=
    document.getElementById("stats");

  if(
    selected!==todayDay ||
    selected==="Sunday"
  ){

    stats.innerHTML=
      "Select today's workout to view progress.";

    return;

  }

  const workout=
    data.workouts[today];

  const exercises=
    Object.values(
      workout?.exercises || {}
    );

  const completed=
    exercises.filter(
      e=>e.done
    ).length;

  const total=
    plans[todayDay]?.length || 0;

  stats.innerHTML=`

    <strong>
      ${completed} / ${total}
    </strong>
    exercises completed

  `;

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

  const box=
    document.getElementById("history");

  box.innerHTML="";

  const dates=
    Object.keys(data.workouts)
    .sort()
    .reverse();

  if(!dates.length){

    box.innerHTML=
      `<div class="empty">
        No workout history yet.
      </div>`;

    return;

  }

  dates.forEach(date=>{

    const workout=
      data.workouts[date];

    const completed=
      Object.values(
        workout.exercises || {}
      ).filter(
        e=>e.done
      ).length;

    const total=
      plans[workout.day]?.length || 0;

    box.innerHTML+=`

      <div class="history-item">

        <strong>${date}</strong>

        <br>

        ${workout.day || ""}

        <br>

        ${completed} / ${total}
        exercises completed

      </div>

    `;

  });

}


/* =========================
   CLEAR TODAY
========================= */

function clearToday(){

  if(
    !confirm(
      "Clear today's workout?"
    )
  ){

    return;

  }

  delete data.workouts[today];

  save();

  render();

}


/* =========================
   REST TIMER
========================= */

let timer=120;

let timerInterval=null;


function updateTimerDisplay(){

  const minutes=
    Math.floor(timer/60)
    .toString()
    .padStart(2,"0");

  const seconds=
    (timer%60)
    .toString()
    .padStart(2,"0");

  document.getElementById(
    "timerDisplay"
  ).textContent=
    `${minutes}:${seconds}`;

}


function startTimer(){

  if(timerInterval) return;

  timerInterval=
    setInterval(()=>{

      if(timer<=0){

        clearInterval(timerInterval);

        timerInterval=null;

        return;

      }

      timer--;

      updateTimerDisplay();

    },1000);

}


function resetTimer(){

  clearInterval(timerInterval);

  timerInterval=null;

  timer=120;

  updateTimerDisplay();

}


/* =========================
   SERVICE WORKER
========================= */

if("serviceWorker" in navigator){

  navigator.serviceWorker.register(
    "./sw.js"
  );

}


/* =========================
   START APP
========================= */

updateTimerDisplay();

render();

</script>

</body>
</html>
