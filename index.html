<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<title>Shehu Fitness</title>

<style>
body{
  font-family:system-ui,sans-serif;
  margin:0;
  background:#f4f5f7;
  color:#171717;
}

header{
  background:#171717;
  color:white;
  padding:20px;
}

header h1{
  margin:0 0 6px;
}

main{
  max-width:900px;
  margin:auto;
  padding:16px;
}

.card{
  background:white;
  border-radius:14px;
  padding:16px;
  margin:12px 0;
  box-shadow:0 2px 8px #0001;
}

button{
  border:0;
  border-radius:10px;
  padding:10px 14px;
  margin:4px;
  background:#171717;
  color:white;
  font-weight:600;
}

button.secondary{
  background:#e7e7e7;
  color:#111;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:8px;
}

.exercise{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.exercise-top{
  display:flex;
  align-items:center;
  gap:10px;
}

.exercise input[type=checkbox]{
  width:20px;
  height:20px;
}

.inputs{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:8px;
  margin-top:10px;
}

.inputs label{
  font-size:12px;
  color:#666;
}

.inputs input{
  width:100%;
  box-sizing:border-box;
  padding:8px;
  border:1px solid #ccc;
  border-radius:7px;
  margin-top:3px;
}

.done{
  text-decoration:line-through;
  color:#777;
}

.timer{
  font-size:40px;
  font-weight:800;
  text-align:center;
  margin:12px;
}

.small{
  color:#666;
  font-size:14px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  text-align:center;
}

.stat{
  background:#f4f5f7;
  padding:12px 5px;
  border-radius:10px;
}

.stat strong{
  display:block;
  font-size:24px;
}

.history-item{
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.previous{
  margin-top:6px;
  font-size:12px;
  color:#666;
}

@media(max-width:500px){
  .inputs{
    grid-template-columns:1fr 1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>🏋️ Shehu Fitness</h1>
  <div>Monday–Saturday • 6:00–8:00 PM</div>
</header>

<main>

<div class="card">
  <h2 id="dayTitle"></h2>
  <div class="grid" id="days"></div>
</div>

<div class="card">
  <h2>⏱️ Workout Timer</h2>

  <div class="timer" id="timer">02:00</div>

  <div style="text-align:center">
    <button onclick="startTimer()">Start</button>
    <button class="secondary" onclick="resetTimer()">Reset</button>
  </div>

  <div class="small" style="text-align:center">
    Use for your 2-minute breaks.
  </div>
</div>

<div class="card">
  <h2>Exercises</h2>
  <div id="routine"></div>
</div>

<div class="card">
  <h2>📊 Today's Progress</h2>

  <div class="stats">

    <div class="stat">
      <strong id="completed">0</strong>
      Exercises
    </div>

    <div class="stat">
      <strong id="setsTotal">0</strong>
      Sets
    </div>

    <div class="stat">
      <strong id="volumeTotal">0</strong>
      Volume
    </div>

  </div>

  <p id="progress"></p>

  <button class="secondary" onclick="clearToday()">
    Clear Today's Workout
  </button>
</div>

<div class="card">
  <h2>📅 Workout History</h2>

  <div id="history"></div>

  <button class="secondary" onclick="clearHistory()">
    Clear History
  </button>
</div>

</main>

<script>

/* =========================
   WORKOUT PLANS
========================= */

const plans={

Monday:{
  focus:"Lower Body",
  ex:[
    "Leg Press",
    "Leg Extension",
    "Leg Curl",
    "Goblet Squat",
    "Calf Raise",
    "Deadlift"
  ]
},

Tuesday:{
  focus:"Upper Body",
  ex:[
    "Lat Pulldown",
    "Bench Press",
    "Shoulder Press",
    "Lateral Raise",
    "Biceps Curl",
    "Triceps Pushdown"
  ]
},

Wednesday:{
  focus:"Back + Rear Shoulders",
  ex:[
    "Pull-ups",
    "Lat Pulldown",
    "Straight-Arm Cable Pulldown",
    "Face Pulls",
    "Dumbbell Rear-Delt Raises",
    "Dumbbell Pullover"
  ]
},

Thursday:{
  focus:"Lower Body",
  ex:[
    "Leg Press",
    "Romanian Deadlift",
    "Leg Curl",
    "Leg Extension",
    "Hip Thrust",
    "Calf Raise"
  ]
},

Friday:{
  focus:"Upper Body",
  ex:[
    "Lat Pulldown",
    "Bench Press",
    "Dumbbell Pullover",
    "Lateral Raise",
    "Biceps Curl",
    "Triceps Pushdown"
  ]
},

Saturday:{
  focus:"Full Body",
  ex:[
    "Leg Press",
    "Bench Press",
    "Lat Pulldown",
    "Shoulder Press",
    "Biceps Curl",
    "Triceps Pushdown"
  ]
},

Sunday:{
  focus:"Rest",
  ex:[]
}

};


/* =========================
   STORAGE
========================= */

const key="shehuFitnessData";

let data=JSON.parse(
  localStorage.getItem(key)||"{}"
);

data.workouts??={};
data.base??={};


/* =========================
   DATE
========================= */

function getDateKey(){

  const d=new Date();

  const year=d.getFullYear();

  const month=String(
    d.getMonth()+1
  ).padStart(2,"0");

  const day=String(
    d.getDate()
  ).padStart(2,"0");

  return `${year}-${month}-${day}`;
}

const today=getDateKey();

const todayDay=
  new Date().toLocaleDateString(
    "en-US",
    {weekday:"long"}
  );


/* =========================
   SELECTED DAY
========================= */

let selected=todayDay;

if(
  !plans[selected] ||
  selected==="Sunday"
){
  selected="Monday";
}


/* =========================
   SAVE
========================= */

function save(){

  localStorage.setItem(
    key,
    JSON.stringify(data)
  );

}


/* =========================
   TODAY'S WORKOUT
========================= */

function getTodayWorkout(){

  data.workouts[today]??={
    day:todayDay,
    exercises:{}
  };

  return data.workouts[today];

}


/* =========================
   RENDER
========================= */

function render(){

  const plan=plans[selected];

  document.getElementById(
    "dayTitle"
  ).textContent=
    selected+" — "+plan.focus;


  document.getElementById(
    "days"
  ).innerHTML=

    Object.keys(plans)
    .filter(d=>d!=="Sunday")
    .map(d=>`

      <button
        class="${d===selected?"":"secondary"}"
        onclick="changeDay('${d}')">

        ${d}

      </button>

    `)
    .join("");


  /*
    Only use today's workout data
    when today's actual day is selected.
  */

  const isToday=
    selected===todayDay &&
    selected!=="Sunday";


  const todayWorkout=
    isToday
      ? getTodayWorkout()
      : null;


  document.getElementById(
    "routine"
  ).innerHTML=

    plan.ex.map(
      (exercise,i)=>{

        let item={};

        /*
          Today's workout:
          use today's actual session data.
        */

        if(
          isToday &&
          todayWorkout.exercises[i]
        ){

          item=
            todayWorkout.exercises[i];

        }

        /*
          Another day:
          show that day's latest base values.
        */

        else{

          item=
            data.base?.[selected]?.[i]||{};

        }


        const previous=
          data.base?.[selected]?.[i];


        return`

        <div class="exercise">

          <div class="exercise-top">

            <input
              type="checkbox"

              ${item.done?"checked":""}

              ${isToday?"":"disabled"}

              onchange="
                toggleExercise(${i})
              "
            >

            <b
              class="${item.done?"done":""}"
            >
              ${i+1}. ${exercise}
            </b>

          </div>


          <div class="inputs">

            <label>
              Sets

              <input
                type="number"
                min="0"
                value="${item.sets??""}"
                placeholder="3"

                onchange="
                  logExercise(
                    ${i},
                    'sets',
                    this.value
                  )
                "
              >
            </label>


            <label>
              Reps

              <input
                type="number"
                min="0"
                value="${item.reps??""}"
                placeholder="10"

                onchange="
                  logExercise(
                    ${i},
                    'reps',
                    this.value
                  )
                "
              >
            </label>


            <label>
              Weight

              <input
                type="number"
                min="0"
                step="0.5"
                value="${item.weight??""}"
                placeholder="kg"

                onchange="
                  logExercise(
                    ${i},
                    'weight',
                    this.value
                  )
                "
              >
            </label>

          </div>


          ${
            previous
            ?
            `
            <div class="previous">
              Previous base:
              ${previous.sets??0} sets ×
              ${previous.reps??0} reps ×
              ${previous.weight??0} kg
            </div>
            `
            :
            ""
          }

        </div>

        `;

      }
    ).join("");


  updateStats();

  renderHistory();

}


/* =========================
   CHANGE DAY
========================= */

function changeDay(day){

  selected=day;

  render();

}


/* =========================
   LOG EXERCISE
========================= */

function logExercise(
  i,
  keyName,
  value
){

  const num=
    Number(value)||0;


  /*
    Always save the latest value
    as that day's base value.
  */

  data.base[selected]??={};

  data.base[selected][i]??={};

  data.base[selected][i][keyName]=num;


  /*
    Only save session data if
    the selected day is actually today.
  */

  if(
    selected===todayDay &&
    selected!=="Sunday"
  ){

    const workout=
      getTodayWorkout();

    workout.exercises[i]??={};

    workout.exercises[i][keyName]=num;

  }


  save();

  render();

}


/* =========================
   TOGGLE COMPLETE
========================= */

function toggleExercise(i){

  /*
    Completion is only for
    today's actual workout.
  */

  if(
    selected!==todayDay ||
    selected==="Sunday"
  ){

    return;

  }


  const workout=
    getTodayWorkout();

  workout.exercises[i]??={};

  workout.exercises[i].done=
    !workout.exercises[i].done;


  save();

  render();

}


/* =========================
   TODAY'S STATISTICS
========================= */

function updateStats(){

  const workout=
    data.workouts[today];


  /*
    Always calculate progress
    from today's actual session.
  */

  const exercises=
    Object.values(
      workout?.exercises||{}
    );


  const completed=
    exercises.filter(
      x=>x.done
    ).length;


  const sets=
    exercises.reduce(
      (sum,x)=>
        sum+(Number(x.sets)||0),
      0
    );


  const volume=
    exercises.reduce(
      (sum,x)=>
        sum+
        (
          (Number(x.sets)||0)*
          (Number(x.reps)||0)*
          (Number(x.weight)||0)
        ),
      0
    );


  document.getElementById(
    "completed"
  ).textContent=
    completed;


  document.getElementById(
    "setsTotal"
  ).textContent=
    sets;


  document.getElementById(
    "volumeTotal"
  ).textContent=
    volume;


  const total=
    plans[todayDay]?.ex.length||0;


  document.getElementById(
    "progress"
  ).textContent=

    todayDay==="Sunday"

      ? "Today is a rest day."

      : `${completed}/${total} exercises completed.`;

}


/* =========================
   HISTORY
========================= */

function renderHistory(){

  const history=
    document.getElementById(
      "history"
    );


  const dates=
    Object.keys(
      data.workouts
    )
    .sort()
    .reverse();


  if(!dates.length){

    history.innerHTML=
      `
      <p class="small">
        No workout history yet.
      </p>
      `;

    return;

  }


  history.innerHTML=

    dates.map(date=>{

      const workout=
        data.workouts[date];


      const exercises=
        Object.values(
          workout.exercises||{}
        );


      const completed=
        exercises.filter(
          x=>x.done
        ).length;


      const sets=
        exercises.reduce(
          (sum,x)=>
            sum+(Number(x.sets)||0),
          0
        );


      return`

      <div class="history-item">

        <b>${date}</b>

        <div class="small">

          ${workout.day||""}

          • ${completed} exercises

          • ${sets} sets

        </div>

      </div>

      `;

    }).join("");

}


/* =========================
   CLEAR TODAY
========================= */

function clearToday(){

  delete data.workouts[today];

  save();

  render();

}


/* =========================
   CLEAR HISTORY
========================= */

function clearHistory(){

  if(
    confirm(
      "Clear all workout history?"
    )
  ){

    data.workouts={};

    save();

    render();

  }

}


/* =========================
   REST TIMER
========================= */

let remaining=120;

let interval=null;


function show(){

  document.getElementById(
    "timer"
  ).textContent=

    `${String(
      Math.floor(remaining/60)
    ).padStart(2,"0")}:${String(
      remaining%60
    ).padStart(2,"0")}`;

}


function startTimer(){

  if(interval)
    return;


  interval=setInterval(()=>{

    remaining--;

    show();


    if(remaining<=0){

      clearInterval(interval);

      interval=null;

      alert(
        "Break finished!"
      );

      remaining=120;

      show();

    }

  },1000);

}


function resetTimer(){

  clearInterval(interval);

  interval=null;

  remaining=120;

  show();

}


/* =========================
   START APP
========================= */

render();

show();


/* =========================
   SERVICE WORKER
========================= */

if(
  "serviceWorker" in navigator
){

  navigator.serviceWorker.register(
    "./sw.js"
  );

}

</script>

</body>
</html>
